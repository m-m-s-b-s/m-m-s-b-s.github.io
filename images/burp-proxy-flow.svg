<svg width="820" height="260" viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/>
    </marker>
  </defs>
  <rect width="820" height="260" fill="#0d1117"/>
  <text x="410" y="28" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#e6edf3" text-anchor="middle">How Burp Suite Sits in the Middle</text>

  <!-- boxes -->
  <rect x="20" y="105" width="160" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="100" y="145" font-family="Arial" font-size="15" fill="#e6edf3" text-anchor="middle">Your</text>
  <text x="100" y="165" font-family="Arial" font-size="15" fill="#e6edf3" text-anchor="middle">Browser</text>

  <rect x="320" y="85" width="180" height="130" rx="8" fill="#1a2233" stroke="#58a6ff" stroke-width="2"/>
  <text x="410" y="135" font-family="Arial" font-size="15" font-weight="bold" fill="#58a6ff" text-anchor="middle">BURP SUITE</text>
  <text x="410" y="155" font-family="Arial" font-size="12" fill="#8b949e" text-anchor="middle">intercept</text>
  <text x="410" y="172" font-family="Arial" font-size="12" fill="#8b949e" text-anchor="middle">inspect / modify</text>

  <rect x="640" y="105" width="160" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="720" y="145" font-family="Arial" font-size="15" fill="#e6edf3" text-anchor="middle">Website</text>
  <text x="720" y="165" font-family="Arial" font-size="15" fill="#e6edf3" text-anchor="middle">Server</text>

  <!-- forward arrows (request) -->
  <line x1="180" y1="125" x2="318" y2="125" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowF)"/>
  <text x="249" y="115" font-family="Arial" font-size="11" fill="#58a6ff" text-anchor="middle">1. Request</text>

  <line x1="500" y1="125" x2="638" y2="125" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowF)"/>
  <text x="569" y="115" font-family="Arial" font-size="11" fill="#58a6ff" text-anchor="middle">3. Forwarded</text>

  <!-- return arrows (response) -->
  <line x1="638" y1="175" x2="500" y2="175" stroke="#f0883e" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="569" y="195" font-family="Arial" font-size="11" fill="#f0883e" text-anchor="middle">4. Response</text>

  <line x1="318" y1="175" x2="180" y2="175" stroke="#f0883e" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="249" y="195" font-family="Arial" font-size="11" fill="#f0883e" text-anchor="middle">5. Returned</text>

  <text x="410" y="235" font-family="Arial" font-size="12" fill="#8b949e" text-anchor="middle">Step 2 (not drawn): you choose Forward or Drop while the request sits frozen in Burp</text>
</svg>
