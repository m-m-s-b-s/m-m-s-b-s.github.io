<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calorie Coach</title>
<meta name="description" content="Your personal AI calorie and nutrition coach. Type or snap your meal, and it counts calories, nutrients and the energy you really burn.">
<meta name="theme-color" content="#061C21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calorie Coach">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script>
(function(){try{var t=localStorage.getItem('cc_theme')||'dark';var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
<style>
:root{
  --bg:#061C21; --s1:#0C2A30; --s2:#12373E; --line:#1C4950; --tx:#E8F4EE; --tx2:#8DB2AF;
  --lime:#B8F060; --limet:#B8F060; --on-lime:#0B2A10;
  --kaki:#FF7A3D; --kakit:#FF9A6A; --on-kaki:#2A0E00; --sky:#5CC8FF; --gold:#F2C94C;
}
:root[data-theme=light]{
  --bg:#EDF5F0; --s1:#FFFFFF; --s2:#DFECE5; --line:#C6DAD0; --tx:#082A2F; --tx2:#4A6967;
  --lime:#8FD43A; --limet:#2F6B0A; --on-lime:#0B2A10;
  --kaki:#F2602A; --kakit:#B23A0C; --on-kaki:#fff; --sky:#2B8FC7; --gold:#D9A400;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Onest,system-ui,-apple-system,"Segoe UI","Hiragino Sans",Roboto,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
h1{font:700 22px/1.2 Unbounded,Onest,system-ui,sans-serif;letter-spacing:-.02em}
h2{font:700 18px/1.3 Onest,sans-serif;margin-bottom:12px;display:flex;align-items:baseline;justify-content:space-between}
h2 small{font:500 13px Onest,sans-serif;color:var(--tx2)}
.num{font-family:Unbounded,Onest,sans-serif;font-weight:700;letter-spacing:-.03em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--lime);outline-offset:2px}
.hide{display:none!important}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.streak{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 10px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font:700 15px Unbounded,sans-serif}
.streak svg{width:18px;height:18px;color:var(--kaki)}
.streak.zero{color:var(--tx2)}.streak.zero svg{color:var(--tx2)}
.datenav{display:inline-flex;align-items:center;margin:4px 0 0 -10px}
.datenav button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--tx2)}
.datenav button:disabled{opacity:.25}
.datenav span{font-weight:600;font-size:15px;color:var(--tx2);min-width:64px;text-align:center}
.sub{color:var(--tx2);font-size:14.5px;margin:6px 0 0}
section{margin-top:30px}
.link{color:var(--limet);font-weight:600;font-size:15px;min-height:40px;padding:0}
/* dial */
.dial{margin:10px auto 0;display:block;width:100%;max-width:340px;height:auto;overflow:visible}
.dial .trk{fill:none;stroke:var(--line)}
.dial .prog{fill:none;stroke:var(--lime);stroke-linecap:round}
.dial .prog.over{stroke:var(--kaki)}
.dial .prog.anim{animation:fill 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes fill{from{stroke-dasharray:0 700}}
.dial .dn{font:700 38px Unbounded,sans-serif;letter-spacing:-.04em;fill:var(--tx);text-anchor:middle}
.dial .dn.over{fill:var(--kakit)}
.dial .dl{font:500 13px Onest,sans-serif;fill:var(--tx2);text-anchor:middle}
.dial .hr{font:500 10px Onest,sans-serif;fill:var(--tx2);text-anchor:middle;dominant-baseline:middle}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:6px 0 0;text-align:center}
.stats dt{font-size:13px;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:6px}
.stats dt i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stats dd{margin:2px 0 0;font:700 19px Unbounded,sans-serif;letter-spacing:-.03em}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--tx2);margin-top:14px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.legend i.bar{border-radius:3px;width:12px;height:6px;vertical-align:1px}
.nudge{display:flex;align-items:center;gap:12px;margin-top:22px;padding:12px 12px 12px 12px;border-radius:22px 22px 22px 6px;background:var(--s1);border:1px solid var(--line)}
.nudge p{margin:0;flex:1;font-size:14.5px;line-height:1.4}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:var(--on-lime)}
.av svg{width:100%;height:100%}
.pillbtn{flex:none;height:38px;padding:0 14px;border-radius:99px;background:var(--lime);color:var(--on-lime);font-weight:700;font-size:14px}
/* meals */
.mlist{display:grid}
.mrow{display:grid;grid-template-columns:56px 1fr auto;gap:2px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.mrow:last-child{border-bottom:0}
.mimg{grid-row:span 2;width:56px;height:56px;border-radius:16px;background:var(--s2);display:grid;place-items:center;font-size:28px;overflow:hidden}
.mimg img{width:100%;height:100%;object-fit:cover;display:block}
.mrow .mn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:end}
.mrow .mt{font-size:13px;color:var(--tx2);align-self:start}
.mrow .mk{grid-row:span 2;font:700 17px Unbounded,sans-serif;letter-spacing:-.03em;text-align:right}
.mrow .mk small{display:block;font:500 12px Onest,sans-serif;color:var(--tx2);letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--s2);color:var(--tx)}
.chip.good{background:color-mix(in srgb,var(--lime) 18%,transparent);color:var(--limet)}
.chip.watch{background:color-mix(in srgb,var(--kaki) 20%,transparent);color:var(--kakit)}
.chip.btn{min-height:40px;padding:0 14px;background:var(--s1);border:1px solid var(--line);font-weight:500;font-size:14.5px}
.mrow .chips{grid-column:2/3;margin-top:4px}
.mrow .chip{font-size:12px;padding:1px 8px}
.empty{padding:26px 18px;border:1.5px dashed var(--line);border-radius:22px;text-align:center;color:var(--tx2)}
.empty b{display:block;color:var(--tx);margin-bottom:4px}
/* nutrition */
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:3px;background:transparent}
.stackbar i{display:block;min-width:4px;border-radius:99px}
.mleg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mleg div{font-size:13px;color:var(--tx2)}
.mleg b{display:block;font:700 17px Unbounded,sans-serif;letter-spacing:-.03em;color:var(--tx)}
.mleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.insight{display:grid;gap:10px;margin-top:16px}
.insight p{margin:0;font-size:14px;color:var(--tx2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.insight p b{color:var(--tx);margin-right:4px}
/* movement */
.track{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:6px}
.track .pulse{width:12px;height:12px;border-radius:50%;background:var(--tx2);flex:none;opacity:.6}
.track.live .pulse{background:var(--lime);opacity:1;animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lime) 60%,transparent)}70%,100%{box-shadow:0 0 0 10px transparent}}
.track .tx{flex:1;font-size:14.5px;line-height:1.35}.track .tx small{display:block;color:var(--tx2)}
.act{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.act:last-of-type{border-bottom:0}
.act i{width:10px;height:10px;border-radius:50%;flex:none}
.act .tx{flex:1}.act .tx small{display:block;color:var(--tx2);font-size:13px}
.act b{font:700 15px Unbounded,sans-serif;letter-spacing:-.03em;color:var(--limet)}
.act button{width:36px;height:36px;color:var(--tx2);font-size:20px}
/* buttons + forms */
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;background:var(--kaki);color:var(--on-kaki);font-weight:700;font-size:17px}
.cta:disabled{opacity:.45}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;background:var(--lime);color:var(--on-lime);font-weight:700;font-size:16.5px}
.primary:disabled{opacity:.45}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--s1);font-weight:600}
.danger{color:var(--kakit)}
textarea,input[type=text],input[type=number],input[type=time],input[type=url],select{width:100%;background:var(--s1);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px;outline:none;color:var(--tx)}
textarea:focus,input:focus,select:focus{border-color:var(--lime)}
textarea{resize:none;line-height:1.5;min-height:96px;font-size:16.5px}
::placeholder{color:var(--tx2);opacity:.75}
label.f{display:block;font-size:14px;color:var(--tx2);margin:14px 0 6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:grid;gap:10px}
/* add */
.snap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%;height:210px;margin-top:16px;border-radius:30px;background:var(--s1);border:1.5px dashed var(--line);text-align:center}
.snap .disc{width:84px;height:84px;border-radius:50%;background:var(--kaki);color:var(--on-kaki);display:grid;place-items:center}
.snap .disc svg{width:38px;height:38px}
.snap b{font-size:18px}.snap small{display:block;color:var(--tx2);font-weight:400;font-size:14px;margin-top:2px}
.shotbox{position:relative;margin-top:16px}
.shotbox img{width:100%;height:230px;object-fit:cover;border-radius:28px;display:block}
.shotbox button{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(6,28,33,.78);color:#fff;font-size:20px}
.orline{display:flex;align-items:center;gap:12px;color:var(--tx2);font-size:14px;margin:20px 0 10px}
.orline:before,.orline:after{content:"";flex:1;height:1px;background:var(--line)}
.err{margin:14px 0;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--kaki) 18%,transparent);color:var(--kakit);font-size:14.5px}
.err .ghost{margin-top:8px;min-height:40px;color:var(--tx)}
.tip{font-size:13px;color:var(--tx2);margin:10px 2px 0}
.note{margin:10px 0;padding:10px 14px;border-radius:14px;background:var(--s2);font-size:14.5px}
.note.warn{background:color-mix(in srgb,var(--kaki) 18%,transparent)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:30px 10px;text-align:center;color:var(--tx2)}
.loading .spin{width:30px;height:30px;color:var(--lime);margin-bottom:10px}
/* coach */
.chead{display:flex;align-items:center;gap:14px}
.chead .av{width:56px;height:56px}
.msgs{display:grid;gap:12px;margin:18px 0}
.mline{display:flex;gap:10px;align-items:flex-end}
.mline .av{width:30px;height:30px}
.msg{max-width:86%;padding:11px 15px;font-size:15.5px;white-space:pre-wrap}
.msg.me{justify-self:end;margin-left:auto;background:var(--lime);color:var(--on-lime);border-radius:20px 20px 6px 20px;font-weight:500}
.msg.ai{background:var(--s1);border:1px solid var(--line);border-radius:20px 20px 20px 6px}
.sug{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--s2);border-radius:14px;padding:10px 12px;margin-top:8px;width:100%;text-align:left}
.sug b{font-weight:700}.sug small{color:var(--tx2);grid-column:1}
.sug .go{grid-row:span 2;grid-column:2;font-weight:700;color:var(--on-lime);background:var(--lime);border-radius:99px;padding:6px 14px}
.askbox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.askbox input{border-radius:99px;padding-left:18px}
.askbox button{width:48px;height:48px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center}
/* you */
.streakcard{display:flex;align-items:center;gap:16px;padding:16px 4px 4px}
.streakcard svg{width:44px;height:44px;color:var(--kaki)}
.streakcard .num{font-size:34px;line-height:1}
.streakcard p{margin:2px 0 0;color:var(--tx2);font-size:14px}
.week{display:flex;align-items:flex-end;gap:8px;height:120px}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--tx2)}
.week i{width:100%;border-radius:10px;background:var(--lime);min-height:4px}
.week i.over{background:var(--kaki)}.week i.none{background:var(--s2)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 10px 4px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center;color:var(--tx2);font-size:12px;font-weight:600}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--tx)}
.tabs button.on svg{color:var(--limet)}
.tabs button.add{position:relative}
.tabs button.add .pl{width:56px;height:56px;margin-top:-22px;border-radius:50%;background:var(--kaki);color:var(--on-kaki);display:grid;place-items:center;border:5px solid var(--bg)}
.tabs button.add .pl svg{width:26px;height:26px;color:inherit}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,12,14,.62);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92dvh;overflow:auto;overflow-x:hidden;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font:700 22px Unbounded,sans-serif;letter-spacing:-.02em;margin-bottom:4px;display:block}
.sheet .stp{display:flex;gap:12px;align-items:center;margin-top:12px}
.sheet .stp img{width:64px;height:64px;border-radius:16px;object-fit:cover}
.rows{display:grid;gap:10px;margin:14px 0;min-width:0}
.fr{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:10px 12px;min-width:0}
.fr .l1{display:grid;grid-template-columns:minmax(0,1fr) 84px 36px;gap:8px;align-items:center}
.fr input{width:100%;min-width:0;min-height:42px;padding:8px 10px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);outline:none}
.fr .nmi{font-weight:600}
.fr .l2{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.fr .qty{flex:1;min-width:110px;min-height:34px;padding:4px 8px;font-size:14px;color:var(--tx2);border-color:transparent;background:transparent}
.fr .qty:focus{border-color:var(--lime);background:var(--bg)}
.fr .mx{font-size:12.5px;color:var(--tx2)}
.fr .x{width:36px;height:36px;border-radius:50%;color:var(--tx2);font-size:20px}
.fr .chips{margin-top:6px}
.fr .chip{font-size:12px;padding:2px 8px}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:6px}
.addrow .ghost{min-height:48px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:50;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
details summary{cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="tabs"><nav id="tabs"></nav></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="hide">
<input type="file" id="fileGal" accept="image/*" class="hide">
<input type="file" id="fileRestore" accept="application/json,.json" class="hide">

<script>
"use strict";
/* ============ basics ============ */
const DEFAULT_WORKER = "https://calorie-coach-api.mmsbs-calories.workers.dev";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  keys() { try { return Object.keys(localStorage); } catch { return []; } }
};
const fmt = n => Math.round(n || 0).toLocaleString("en-US");
const pad = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const minsOf = t => { const [h, m] = (t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const addDays = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d + n); return isoOf(dt); };
const uid = () => Math.random().toString(36).slice(2, 10);
function prettyDate(iso) {
  if (iso === todayISO()) return "Today";
  if (iso === addDays(todayISO(), -1)) return "Yesterday";
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
const I = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  add: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',

function getDay(date) {
  const def = { date, meals: [], schedule: [], notes: "" };
  let d = def;
  try { const raw = LS.get(dayKey(date)); if (raw) d = { ...def, ...JSON.parse(raw) }; } catch { }
  d.meals = (d.meals || []).map((m, i) => ({
    id: m.id || uid(), gid: m.gid || "old" + i, time: m.time || "12:00",
    name: m.name ?? m.item ?? "Food", qty: m.qty || "", kcal: Number(m.kcal ?? m.calories ?? 0),
    p: +m.p || 0, c: +m.c || 0, f: +m.f || 0, tags: m.tags || [], img: m.img || ""
  }));
  d.schedule = (d.schedule || []).map(a => ({ ...a, id: a.id || uid() }));
  return d;
}
const saveDay = d => LS.set(dayKey(d.date), JSON.stringify(d));

function burnOf(a) {
  const hours = a.min != null ? a.min / 60 : Math.max(0, (minsOf(a.end) - minsOf(a.start)) / 60);
  const met = a.met ?? TYPES[a.activity]?.met ?? 1.5;
  return Math.max(0, met - 1) * (profile.weight || 70) * hours;   // only the energy ABOVE resting
}
function totals(day) {
  const s = k => day.meals.reduce((a, m) => a + (+m[k] || 0), 0);
  return {
    eaten: Math.round(s("kcal")), p: s("p"), c: s("c"), f: s("f"),
    burn: Math.round(day.schedule.reduce((a, x) => a + burnOf(x), 0))
  };
}
function proteinGoal() { return Math.round((profile.weight || 70) * (profile.goal === "gain" ? 1.8 : profile.goal === "lose" ? 1.5 : 1.2)); }

/* ============ network ============ */
const workerBase = () => (LS.get("cc_worker_url") || DEFAULT_WORKER).replace(/\/+$/, "");
async function api(path, body, ms = 45000) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), ms);
  let res;
  try {
    res = await fetch(workerBase() + path, {
      method: body ? "POST" : "GET",
      headers: body ? { "Content-Type": "application/json", "X-CC-Client": clientId } : {},
      body: body ? JSON.stringify(body) : undefined, signal: ctl.signal
    });
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "The AI took too long to answer. Try again." : "Can't reach the server. Check your internet connection.");
  } finally { clearTimeout(to); }
  let data = null; try { data = await res.json(); } catch { }
  if (!res.ok) throw new Error(data?.error || `Server error (${res.status}).`);
  return data;
}

const emo = n => { for (const [r, e] of EMO) if (r.test(n || "")) return e; return "🍽️"; };
const polar = (cx, cy, r, deg) => { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
const arcPath = (cx, cy, r, d0, d1) => {
  const [x0, y0] = polar(cx, cy, r, d0), [x1, y1] = polar(cx, cy, r, d1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${d1 - d0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
};
function streakCount() {
  const has = d => getDay(d).meals.length > 0; let d = todayISO(), n = 0;
  if (!has(d)) d = addDays(d, -1);

}

    return `<path d="${arcPath(C, C, RO, deg(s), Math.max(deg(e), deg(s) + 3))}" fill="none" stroke-width="14" stroke-linecap="round" style="stroke:${TYPES[a.activity]?.color || TYPES.other.color}"/>`;
  }).join("");
  const beads = [...new Set(day.meals.map(m => m.gid))].map(g => day.meals.find(m => m.gid === g)).map(m => {

  const pct = Math.min(1, cap ? t.eaten / cap : 0), tk = cap ? Math.min(1, profile.target / cap) * 360 : 360;

    ${pct < 1 && tk < 359 ? `<line x1="${t1.toFixed(1)}" y1="${t2.toFixed(1)}" x2="${t3.toFixed(1)}" y2="${t4.toFixed(1)}" stroke-width="2.5" style="stroke:var(--tx2)"/>` : ""}
    ${beads}${now}

    <text class="dl" x="${C}" y="${C + 28}">kcal ${over ? "over" : "left"}</text></svg>`;
}

/* ============ photos ============ */
function loadPhoto(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onerror = () => toast("Couldn't read that photo");
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1024, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", 0.82);
      const tc = document.createElement("canvas"); tc.width = tc.height = 128; const sq = Math.min(img.width, img.height);
      tc.getContext("2d").drawImage(img, (img.width - sq) / 2, (img.height - sq) / 2, sq, sq, 0, 0, 128, 128);
      addPhoto = { url, b64: url.split(",")[1], thumb: tc.toDataURL("image/jpeg", 0.6) }; addErr = "";
      if (tab !== "add") tab = "add"; renderTabs(); render();
    };
    img.onerror = () => toast("That image format isn't supported");
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* ============ GPS: walk vs train ============ */
const haversine = (a, b, c, d) => { const R = 6371000, r = x => x * Math.PI / 180; const dl = r(c - a), dn = r(d - b); const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
let wakeLock = null;
async function lockScreen() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch { } }
document.addEventListener("visibilitychange", () => { if (tracking && document.visibilityState === "visible") lockScreen(); });

function startTrack() {
  if (!navigator.geolocation) { trackInfo.err = "Location isn't available on this device."; render(); return; }
  trackInfo = { cls: "still", kmh: 0, km: 0, err: "" };
  tracking = { last: null, speeds: [], cand: null, candN: 0, seg: null, lastSave: 0 };
  tracking.id = navigator.geolocation.watchPosition(onFix, e => {
    stopTrack(); trackInfo.err = e.code === 1 ? "Location is blocked. Allow it in your browser settings." : "Couldn't get a GPS signal.";
    render();
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 25000 });
  lockScreen(); render(); toast("Tracking started");
}
function stopTrack() {
  if (!tracking) return;
  navigator.geolocation.clearWatch(tracking.id); finishSeg(); tracking = null;
  try { wakeLock?.release(); } catch { } wakeLock = null;
  render();
}
function onFix(p) {
  if (!tracking) return;
  const { latitude: la, longitude: lo, accuracy, speed } = p.coords, t = p.timestamp || Date.now();
  if (accuracy > 60) return;
  let kmh = speed != null && !isNaN(speed) ? speed * 3.6 : null, d = 0;
  if (tracking.last) {
    d = haversine(tracking.last.la, tracking.last.lo, la, lo); const dt = (t - tracking.last.t) / 1000;
    if (kmh == null && dt > 0) kmh = d / dt * 3.6;
  }
  tracking.last = { la, lo, t };
  if (kmh == null) return;
  tracking.speeds.push(kmh); if (tracking.speeds.length > 4) tracking.speeds.shift();
  const avg = tracking.speeds.reduce((a, b) => a + b, 0) / tracking.speeds.length;
  const cls = avg < 1 ? "still" : avg < 8 ? "walk" : "train";
  // need 3 fixes in a row of a new class before switching (avoids flicker)
  const curCls = tracking.seg ? tracking.seg.type : "still";
  if (cls !== curCls) { tracking.candN = tracking.cand === cls ? tracking.candN + 1 : 1; tracking.cand = cls; }
  else { tracking.cand = null; tracking.candN = 0; }
  if (tracking.cand && tracking.candN >= 3) {
    finishSeg();
    if (cls !== "still") tracking.seg = { id: uid(), type: cls, start: t, end: t, m: 0 };
    tracking.cand = null; tracking.candN = 0;
  }
  if (tracking.seg) { tracking.seg.m += d > 3 ? d : 0; tracking.seg.end = t; }
  trackInfo.cls = tracking.seg ? tracking.seg.type : "still"; trackInfo.kmh = avg;
  trackInfo.km = tracking.seg ? tracking.seg.m / 1000 : 0;
  if (tracking.seg && t - tracking.lastSave > 15000) { saveSeg(); tracking.lastSave = t; }
  if (tab === "today" && viewDate === todayISO() && !sheet) render();
}
function saveSeg(final) {
  const s = tracking?.seg; if (!s) return;
  const mins = (s.end - s.start) / 60000; const day = getDay(todayISO());
  const hrs = mins / 60, kmh = hrs > 0 ? s.m / 1000 / hrs : 0;
  const met = s.type === "train" ? TYPES.train.met : kmh < 3.2 ? 2.8 : kmh < 4.8 ? 3.5 : kmh < 6.4 ? 4.3 : 5.0;
  const hm = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const entry = { id: s.id, activity: s.type, start: hm(s.start), end: hm(Math.max(s.end, s.start + 60000)), min: Math.max(mins, 0.5), km: s.m / 1000, met, source: "gps" };
  const i = day.schedule.findIndex(a => a.id === s.id);
  if (i >= 0) day.schedule[i] = entry; else day.schedule.push(entry);
  saveDay(day);
}
function finishSeg() {
  const s = tracking?.seg; if (!s) return;
  if ((s.end - s.start) < 45000) {   // too short to matter: drop it
    const day = getDay(todayISO()); day.schedule = day.schedule.filter(a => a.id !== s.id); saveDay(day);
  } else saveSeg(true);
  tracking.seg = null;
}

/* ============ export / import ============ */
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCsv() {
  const rows = [["date", "time", "item", "amount", "kcal", "protein_g", "carbs_g", "fat_g"]];
  allDays().forEach(k => { const d = k.slice(-10); getDay(d).meals.forEach(m => rows.push([d, m.time, m.name, m.qty, m.kcal, m.p, m.c, m.f])); });
  download("calorie-coach.csv", rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv");
}
function exportJson() {
  const out = { app: "calorie-coach", profile, days: {} };
  allDays().forEach(k => { try { out.days[k.slice(-10)] = JSON.parse(LS.get(k)); } catch { } });
  download("calorie-coach-backup.json", JSON.stringify(out), "application/json");
}
function restore(file) {
  if (!file) return;
  file.text().then(t => {
    const o = JSON.parse(t); if (o.app !== "calorie-coach") throw 0;
    Object.entries(o.days || {}).forEach(([d, v]) => LS.set(dayKey(d), JSON.stringify(v)));
    if (o.profile) { profile = { ...profile, ...o.profile }; saveProfile(); }
    toast("Backup restored"); render();
  }).catch(() => toast("That isn't a Calorie Coach backup"));
}

  logit: logIt,
  manual: () => openReview({ items: [{ name: "", qty: "", kcal: 0 }] }),
  quick: el => { const m = recentFoods()[+el.dataset.i]; openReview({ items: [{ name: m.name, qty: m.qty, kcal: m.kcal, p: m.p, c: m.c, f: m.f, tags: m.tags }] }); },
  editmeal: el => { const g = mealGroups(getDay(viewDate)).find(x => x.gid === el.dataset.g); if (g) openReview({ items: g.items, gid: g.gid, time: g.time, mode: "edit", thumb: g.img || null }); },
  rmitem: el => { sheet.items.splice(+el.dataset.i, 1); renderSheet(); },
  blankitem: () => { sheet.items.push({ id: uid(), name: "", qty: "", kcal: 0, p: 0, c: 0, f: 0, tags: [] }); renderSheet(); },
  addmissed: addMissed, savemeal: commitMeal,
  delmeal: () => { const day = getDay(sheet.date); day.meals = day.meals.filter(m => m.gid !== sheet.gid); saveDay(day); closeSheet(); render(); toast("Meal deleted"); },
  closesheet: closeSheet,
  addact: () => { sheet = { kind: "activity", err: "" }; renderSheet(); showSheet(); },
  saveact: () => {
    const type = $("#aType").value, st = $("#aStart").value, en = $("#aEnd").value;
    if (!st || !en || minsOf(en) <= minsOf(st)) { sheet.err = "End time must be after start time."; renderSheet(); return; }
    const day = getDay(viewDate); day.schedule.push({ id: uid(), activity: type, start: st, end: en }); saveDay(day);
    closeSheet(); render(); toast("Activity added");
  },
  delact: el => { const day = getDay(viewDate); day.schedule = day.schedule.filter(a => a.id !== el.dataset.id); saveDay(day); render(); },
  starttrack: startTrack, stoptrack: () => { stopTrack(); toast("Tracking stopped"); },
  savewelcome: () => {
    profile.weight = Math.min(250, Math.max(25, +$("#wWeight").value || 70)); profile.goal = $("#wGoal").value;
    profile.target = Math.min(6000, Math.max(1000, +$("#wTarget").value || 2200)); profile.onboarded = true; saveProfile(); closeSheet(); render();
  },
  install: async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; render(); },
  share: async () => {
    const data = { title: "Calorie Coach", text: "My AI calorie coach — try it:", url: location.href.split("#")[0] };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(data.url); toast("Link copied"); } } catch { }
  },
  exportCsv, exportJson, restore: () => $("#fileRestore").click(),
  health: async el => {
    const out = $("#healthOut"); out.innerHTML = '<p class="sub" style="margin-top:10px"><span class="spin"></span> Testing…</p>';
    try {
      const r = await api("/api/health?test=1", null, 30000);
      out.innerHTML = r.ok ? `<div class="note">✅ Connected. AI model: ${esc(r.model)}</div>` : `<div class="err">${esc(r.error || "The AI did not answer.")}</div>`;
    } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (el && actions[el.dataset.act]) actions[el.dataset.act](el, e);
});
$("#scrim").addEventListener("click", () => { if (sheet && sheet.kind !== "welcome") closeSheet(); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "addText") addText = t.value;
  else if (t.id === "coachText") coachText = t.value;
  else if (t.id === "mtime" && sheet) sheet.time = t.value;
  else if (t.id === "dayNote") { const d = getDay(todayISO()); d.notes = t.value; saveDay(d); }
  else if (t.dataset.f && sheet?.items) {
    const it = sheet.items[+t.dataset.i]; if (!it) return;
    if (t.dataset.f === "kcal") {
      const nk = Math.max(0, +t.value || 0);
      if (it.kcal > 0 && nk > 0) { const r = nk / it.kcal; it.p *= r; it.c *= r; it.f *= r; }
      it.kcal = nk; const tot = $("#sheetTotal"); if (tot) tot.textContent = fmt(sheetTotal());
    } else it[t.dataset.f] = t.value;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "pName") { profile.name = t.value.trim(); saveProfile(); }
  if (t.id === "pWeight") { profile.weight = Math.min(250, Math.max(25, +t.value || 70)); saveProfile(); }
  if (t.id === "pTarget") { profile.target = Math.min(6000, Math.max(1000, +t.value || 2200)); saveProfile(); }
  if (t.id === "pGoal") { profile.goal = t.value; saveProfile(); }
  if (t.id === "pWorker") { const v = t.value.trim(); LS.set("cc_worker_url", v); toast(v ? "Server saved" : "Using default server"); }
  if (t.id === "pTheme") { LS.set("cc_theme", t.value); applyTheme(); }
  if (t.id === "fileCam" || t.id === "fileGal") { loadPhoto(t.files[0]); t.value = ""; }
  if (t.id === "fileRestore") { restore(t.files[0]); t.value = ""; }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "coachText") { e.preventDefault(); actions.ask(); }
  if (e.target.id === "missed") { e.preventDefault(); addMissed(); }
});

/* ============ theme, install, service worker ============ */
function applyTheme() {
  const t = LS.get("cc_theme", "dark"); const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelector('meta[name=theme-color]').content = dark ? "#061C21" : "#EDF5F0";
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (tab === "you") render(); });
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.register("sw.js").catch(() => { });
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded && !tracking && !sheet) { reloaded = true; location.reload(); } });
}

function pruneThumbs() {
  const mark = LS.get("cc_pruned"); if (mark === todayISO()) return;
  const cutoff = addDays(todayISO(), -30);
  allDays().forEach(k => { const d = k.slice(-10); if (d >= cutoff) return; try { const o = JSON.parse(LS.get(k)); if ((o.meals || []).some(m => m.img)) { o.meals.forEach(m => delete m.img); LS.set(k, JSON.stringify(o)); } } catch { } });
  LS.set("cc_pruned", todayISO());
}
pruneThumbs(); applyTheme(); renderTabs(); render();
setInterval(() => { if (tab === "today" && viewDate === todayISO() && !sheet && !tracking && document.visibilityState === "visible") render(); }, 60000);
</script>
</body>
