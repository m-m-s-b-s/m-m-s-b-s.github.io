<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calorie Coach</title>
<meta name="description" content="Your personal AI calorie and nutrition coach. Type or snap your meal, and it counts calories, nutrients and the energy you really burn.">
<meta name="theme-color" content="#F5F1E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calorie Coach">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script>
(function(){try{var t=localStorage.getItem('cc_theme')||'auto';var d=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
<style>
:root{
  --paper:#F5F1E6; --card:#FFFDF8; --ink:#143339; --ink2:#52686C; --line:#E4DCCA;
  --matcha:#5E8F3E; --matcha-d:#3F6A27; --matcha-bg:#E6EFD8;
  --kaki:#E8743B; --kaki-d:#B84F1E; --kaki-bg:#FBE4D6;
  --blue:#4F86B3; --blue-bg:#DEE9F2; --ochre:#C9A227; --stone:#B9AD93;
  --shadow:0 1px 2px rgba(20,51,57,.06),0 8px 24px rgba(20,51,57,.07);
  --r:18px;
}
:root[data-theme=dark]{
  --paper:#0F1E21; --card:#17292D; --ink:#EAF0E6; --ink2:#9DB2B1; --line:#27403F;
  --matcha:#8DBF66; --matcha-d:#A9D585; --matcha-bg:#243A26;
  --kaki:#F28B57; --kaki-d:#F7A47C; --kaki-bg:#42291D;
  --blue:#7FB0DA; --blue-bg:#1E3444; --ochre:#D9B83F; --stone:#5E7170;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Albert Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;-webkit-font-smoothing:antialiased}
h1,h2,h3,.big{font-family:"Bricolage Grotesque","Albert Sans",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:44px}
.top h1{font-size:26px;font-weight:800}
.datenav{display:flex;align-items:center;gap:2px}
.datenav button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.datenav button:disabled{opacity:.25}
.datenav span{font-weight:600;font-size:14px;color:var(--ink2);min-width:92px;text-align:center}
.sub{color:var(--ink2);font-size:14px;margin:0}
section{margin-top:26px}
h2{font-size:19px;font-weight:700;margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between}
h2 small{font:500 13px "Albert Sans",sans-serif;color:var(--ink2);letter-spacing:0}
.link{color:var(--matcha-d);font-weight:600;font-size:14px;min-height:36px;padding:0 4px}
.hero{padding-top:8px}
.heroNum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-size:68px;font-weight:800;line-height:1;color:var(--ink)}
.big.over{color:var(--kaki-d)}
.unit{color:var(--ink2);font-weight:600}
.bar{position:relative;height:14px;border-radius:99px;background:var(--line);margin:16px 0 14px;overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--matcha);transition:width .5s}
.bar.over i{background:var(--kaki)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:3px;background:var(--ink);opacity:.55}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.trio div{padding:0}
.trio dt{font-size:13px;color:var(--ink2)}
.trio dd{margin:0;font:700 20px "Bricolage Grotesque",sans-serif}
.ask{margin-top:14px;display:inline-flex;align-items:center;gap:6px;color:var(--matcha-d);font-weight:600;min-height:40px}
.macros{display:grid;gap:10px}
.mac{display:grid;grid-template-columns:70px 1fr 74px;align-items:center;gap:10px;font-size:14px}
.mac .tr{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.mac .tr i{display:block;height:100%;border-radius:9px}
.mac span:last-child{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--line);color:var(--ink)}
.chip.good{background:var(--matcha-bg);color:var(--matcha-d)}
.chip.watch{background:var(--kaki-bg);color:var(--kaki-d)}
.chip.btn{min-height:36px;background:var(--card);border:1px solid var(--line);font-weight:500}
.insight{display:grid;gap:8px;margin-top:12px}
.insight p{margin:0;font-size:14px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.strip{position:relative;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.strip .seg{position:absolute;top:10px;bottom:10px;border-radius:6px;min-width:3px}
.strip .meal{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--kaki);border:2px solid var(--card)}
.strip .now{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.7}
.strip .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.hours{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.list{display:grid;gap:10px}
.item{background:var(--card);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%}
.item .tm{font:700 14px "Bricolage Grotesque",sans-serif;color:var(--ink2);grid-row:span 2;width:44px}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .kc{font:800 18px "Bricolage Grotesque",sans-serif;grid-row:span 2}
.item .kc small{font:500 12px "Albert Sans",sans-serif;color:var(--ink2)}
.item .chips{grid-column:2;margin-top:3px}
.item .chip{padding:2px 8px;font-size:12px}
.act{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.act:last-child{border:0}
.act i{width:10px;height:10px;border-radius:3px;flex:none}
.act .tx{flex:1}.act .tx small{display:block;color:var(--ink2);font-size:13px}
.act button{width:36px;height:36px;color:var(--ink2);font-size:20px}
.empty{padding:22px 16px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;background:var(--ink);color:var(--paper);font-weight:700;font-size:16px}
.primary.kaki{background:var(--kaki);color:#fff}
.primary:disabled{opacity:.45}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.danger{color:var(--kaki-d)}
textarea,input[type=text],input[type=number],input[type=time],input[type=url],select{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--matcha)}
textarea{resize:none;line-height:1.5;min-height:116px;font-size:17px}
label.f{display:block;font-size:14px;color:var(--ink2);margin:12px 0 5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos{display:flex;gap:10px;margin:12px 0}
.photos .ghost{flex:1}
.thumb{position:relative;display:inline-block;margin:0 0 12px}
.thumb img{width:96px;height:96px;object-fit:cover;border-radius:14px;display:block}
.thumb button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:16px}
.err{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--kaki-bg);color:var(--kaki-d);font-size:14.5px}
.err .ghost{margin-top:8px;min-height:40px}
.tip{font-size:13px;color:var(--ink2);margin:8px 2px 0}
.note{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--blue-bg);font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 10px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;color:var(--ink2);font-size:12px;font-weight:600}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{color:var(--matcha-d)}
.tabs button.add span.pl{width:46px;height:34px;border-radius:12px;background:var(--kaki);color:#fff;display:grid;place-items:center}
.tabs button.add.on span.pl{box-shadow:0 0 0 3px color-mix(in srgb,var(--kaki) 30%,transparent)}
.scrim{position:fixed;inset:0;background:rgba(10,24,27,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{overflow-x:hidden;position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92dvh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:22px;margin-bottom:4px}
.rows{display:grid;gap:10px;margin:14px 0;min-width:0}
.fr{background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.fr{min-width:0}.fr .l1{display:grid;grid-template-columns:minmax(0,1fr) 84px 36px;gap:8px;align-items:center}
.fr input{width:100%;min-width:0;min-height:42px;padding:8px 10px;border-radius:11px;background:var(--paper);border:1.5px solid var(--line);outline:none}
.fr .nmi{font-weight:600}
.fr .l2{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.fr .qty{flex:1;min-width:110px;min-height:34px;padding:4px 8px;font-size:14px;color:var(--ink2);border-color:transparent;background:transparent}
.fr .qty:focus{border-color:var(--matcha);background:var(--card)}
.fr .mx{font-size:12.5px;color:var(--ink2)}
.fr .x{width:36px;height:36px;border-radius:50%;color:var(--ink2);font-size:20px}
.fr .chips{margin-top:6px}
.fr .chip{font-size:12px;padding:2px 8px}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:6px}
.addrow .ghost{min-height:48px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:30px 10px;text-align:center;color:var(--ink2)}
.loading .spin{width:30px;height:30px;color:var(--matcha);margin-bottom:10px}
.msgs{display:grid;gap:10px;margin:14px 0}
.msg{max-width:92%;padding:11px 14px;border-radius:18px;font-size:15.5px;white-space:pre-wrap}
.msg.me{justify-self:end;background:var(--ink);color:var(--paper);border-bottom-right-radius:6px}
.msg.ai{justify-self:start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.sug{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--matcha-bg);border-radius:14px;padding:10px 12px;margin-top:8px;width:100%;text-align:left}
.sug b{font-weight:700}.sug small{color:var(--ink2);grid-column:1}
.sug .go{grid-row:span 2;grid-column:2;font-weight:700;color:var(--matcha-d)}
.askbox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.askbox input{border-radius:99px;padding-left:18px}
.askbox button{width:48px;height:48px;border-radius:50%;background:var(--matcha-d);color:#fff;display:grid;place-items:center}
.track{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px}
.track .pulse{width:12px;height:12px;border-radius:50%;background:var(--stone);flex:none}
.track.live .pulse{background:var(--matcha);box-shadow:0 0 0 0 var(--matcha);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.track .tx{flex:1;font-size:14.5px}.track .tx small{display:block;color:var(--ink2)}
.week{display:flex;align-items:flex-end;gap:8px;height:110px}
.week div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;font-size:12px;color:var(--ink2)}
.week i{width:100%;border-radius:8px 8px 4px 4px;background:var(--matcha);min-height:3px}
.week i.over{background:var(--kaki)}.week i.none{background:var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.kv:last-child{border:0}
.kv small{display:block;color:var(--ink2)}
.stack{display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:50;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
pre.out{white-space:pre-wrap;font-size:13px;background:var(--card);border-radius:12px;padding:10px;margin:8px 0 0;overflow:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="tabs"><nav id="tabs"></nav></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="hide">
<input type="file" id="fileGal" accept="image/*" class="hide">
<input type="file" id="fileRestore" accept="application/json,.json" class="hide">

<script>
"use strict";
/* ============ basics ============ */
const DEFAULT_WORKER = "https://calorie-coach-api.mmsbs-calories.workers.dev";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  keys() { try { return Object.keys(localStorage); } catch { return []; } }
};
const fmt = n => Math.round(n || 0).toLocaleString("en-US");
const pad = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const minsOf = t => { const [h, m] = (t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const addDays = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); const dt = new Date(y, m - 1, d + n); return isoOf(dt); };
const uid = () => Math.random().toString(36).slice(2, 10);
function prettyDate(iso) {
  if (iso === todayISO()) return "Today";
  if (iso === addDays(todayISO(), -1)) return "Yesterday";
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
const I = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  add: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  coach: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.7 7L4 20l1.1-4A8 8 0 1 1 20 12Z"/><path d="M9 11.5h.01M12 11.5h.01M15 11.5h.01" stroke-width="2.6"/></svg>',
  you: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.7"/><path d="M4.8 20c.9-3.6 3.7-5.4 7.2-5.4s6.3 1.8 7.2 5.4"/></svg>',
  cam: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>',
  img: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m20 16-4.5-4.5L7 20"/></svg>',
  send: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  prev: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
  next: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>'
};

/* ============ profile & data ============ */
const GOALS = { lose: "Lose weight", maintain: "Maintain", gain: "Build muscle", healthy: "Eat healthier" };
let profile = (() => { try { return { name: "", weight: 70, goal: "maintain", target: 2200, onboarded: false, ...JSON.parse(LS.get("cc_profile", "{}")) }; } catch { return { name: "", weight: 70, goal: "maintain", target: 2200, onboarded: false }; } })();
const saveProfile = () => LS.set("cc_profile", JSON.stringify(profile));
const currentUser = LS.get("babu_current_user", "You");          // kept so older saved days still load
const dayKey = d => "cc_" + currentUser + "_" + d;
const clientId = (() => { let c = LS.get("cc_client"); if (!c) { c = uid() + uid(); LS.set("cc_client", c); } return c; })();

const TYPES = {
  walk:    { label: "Walk",                 met: 3.5, color: "var(--matcha)" },
  train:   { label: "Train / bus",          met: 1.5, color: "var(--blue)" },
  work:    { label: "Work shift (on feet)", met: 2.5, color: "var(--ink2)" },
  desk:    { label: "Desk work",            met: 1.4, color: "var(--ink2)" },
  class:   { label: "Class / study",        met: 1.3, color: "var(--ink2)" },
  cricket: { label: "Sport / workout",      met: 6.0, color: "var(--ochre)" },
  other:   { label: "Other",                met: 1.5, color: "var(--stone)" }
};

function getDay(date) {
  const def = { date, meals: [], schedule: [], notes: "" };
  let d = def;
  try { const raw = LS.get(dayKey(date)); if (raw) d = { ...def, ...JSON.parse(raw) }; } catch { }
  d.meals = (d.meals || []).map((m, i) => ({
    id: m.id || uid(), gid: m.gid || "old" + i, time: m.time || "12:00",
    name: m.name ?? m.item ?? "Food", qty: m.qty || "", kcal: Number(m.kcal ?? m.calories ?? 0),
    p: +m.p || 0, c: +m.c || 0, f: +m.f || 0, tags: m.tags || []
  }));
  d.schedule = (d.schedule || []).map(a => ({ ...a, id: a.id || uid() }));
  return d;
}
const saveDay = d => LS.set(dayKey(d.date), JSON.stringify(d));

function burnOf(a) {
  const hours = a.min != null ? a.min / 60 : Math.max(0, (minsOf(a.end) - minsOf(a.start)) / 60);
  const met = a.met ?? TYPES[a.activity]?.met ?? 1.5;
  return Math.max(0, met - 1) * (profile.weight || 70) * hours;   // only the energy ABOVE resting
}
function totals(day) {
  const s = k => day.meals.reduce((a, m) => a + (+m[k] || 0), 0);
  return {
    eaten: Math.round(s("kcal")), p: s("p"), c: s("c"), f: s("f"),
    burn: Math.round(day.schedule.reduce((a, x) => a + burnOf(x), 0))
  };
}
function proteinGoal() { return Math.round((profile.weight || 70) * (profile.goal === "gain" ? 1.8 : profile.goal === "lose" ? 1.5 : 1.2)); }

/* ============ network ============ */
const workerBase = () => (LS.get("cc_worker_url") || DEFAULT_WORKER).replace(/\/+$/, "");
async function api(path, body, ms = 45000) {
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), ms);
  let res;
  try {
    res = await fetch(workerBase() + path, {
      method: body ? "POST" : "GET",
      headers: body ? { "Content-Type": "application/json", "X-CC-Client": clientId } : {},
      body: body ? JSON.stringify(body) : undefined, signal: ctl.signal
    });
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "The AI took too long to answer. Try again." : "Can't reach the server. Check your internet connection.");
  } finally { clearTimeout(to); }
  let data = null; try { data = await res.json(); } catch { }
  if (!res.ok) throw new Error(data?.error || `Server error (${res.status}).`);
  return data;
}

    if (e <= s) e = Math.min(1440, s + 1);
    e = Math.min(1440, e);
    return `<i class="seg" style="left:${s / 14.4}%;width:${(e - s) / 14.4}%;background:${TYPES[a.activity]?.color || TYPES.other.color}"></i>`;
  }).join("");
  const meals = [...new Set(day.meals.map(m => m.gid))].map(g => day.meals.find(m => m.gid === g))
    .map(m => `<i class="meal" style="left:${minsOf(m.time) / 14.4}%"></i>`).join("");
  const now = viewDate === todayISO() ? `<i class="now" style="left:${minsOf(nowHM()) / 14.4}%"></i>` : "";
  const ticks = [25, 50, 75].map(p => `<i class="tick" style="left:${p}%"></i>`).join("");
  return `<div class="strip" aria-label="Timeline of your day">${ticks}${segs}${meals}${now}</div>
    <div class="hours"><span>12am</span><span>6am</span><span>noon</span><span>6pm</span><span>12am</span></div>
    <div class="legend"><span><i style="background:var(--kaki);border-radius:50%"></i>Meals</span><span><i style="background:var(--matcha)"></i>Walking</span><span><i style="background:var(--blue)"></i>Train</span><span><i style="background:var(--ink2)"></i>Work / class</span></div>`;
}
function mealGroups(day) {
  const g = new Map();
  day.meals.forEach(m => { if (!g.has(m.gid)) g.set(m.gid, []); g.get(m.gid).push(m); });
  return [...g.entries()].map(([gid, items]) => ({ gid, items, time: items[0].time, kcal: items.reduce((a, m) => a + m.kcal, 0) }))
    .sort((a, b) => minsOf(a.time) - minsOf(b.time));
}
function tagSummary(day) {
  const good = new Map(), watch = new Map();
  day.meals.forEach(m => (m.tags || []).forEach(t => { const mp = t.type === "watch" ? watch : good; mp.set(t.label, (mp.get(t.label) || 0) + 1); }));
  return { good: [...good.keys()].slice(0, 6), watch: [...watch.keys()].slice(0, 5) };
}

      <div style="align-self:end"><button class="ghost" style="width:100%" data-act="blankitem">+ Blank row</button></div></div>
    <button class="primary" data-act="savemeal" ${s.items.length ? "" : "disabled"}>${s.mode === "edit" ? "Save" : "Add to day"} · <span id="sheetTotal">${fmt(sheetTotal())}</span> kcal</button>
    ${s.mode === "edit" ? `<button class="link danger" style="margin-top:8px;width:100%" data-act="delmeal">Delete this meal</button>` : `<button class="link" style="margin-top:8px;width:100%" data-act="closesheet">Cancel</button>`}`;
  } else if (s.kind === "activity") {
    el.innerHTML = `<div class="grab"></div><h2>Add activity</h2>
    <p class="sub">Work shifts burn more than sitting still, so they count toward your day.</p>
    <label class="f" for="aType">Type</label><select id="aType">${Object.entries(TYPES).filter(([k]) => k !== "train").map(([k, v]) => `<option value="${k}" ${k === "work" ? "selected" : ""}>${v.label}</option>`).join("")}<option value="train">Train / bus</option></select>
    <div class="row2"><div><label class="f" for="aStart">From</label><input type="time" id="aStart" value="09:00"></div><div><label class="f" for="aEnd">To</label><input type="time" id="aEnd" value="17:00"></div></div>
    ${s.err ? `<div class="err">${esc(s.err)}</div>` : ""}
    <button class="primary" style="margin-top:18px" data-act="saveact">Add</button><button class="link" style="margin-top:8px;width:100%" data-act="closesheet">Cancel</button>`;
  } else if (s.kind === "welcome") {
    el.innerHTML = `<div class="grab"></div><h2>Welcome 👋</h2>
    <p class="sub">Three quick numbers so the coach can be accurate. You can change them any time in <b>You</b>.</p>
    <label class="f" for="wWeight">Your weight (kg)</label><input type="number" id="wWeight" inputmode="decimal" value="${profile.weight}">
    <label class="f" for="wGoal">Your goal</label><select id="wGoal">${Object.entries(GOALS).map(([k, v]) => `<option value="${k}" ${profile.goal === k ? "selected" : ""}>${v}</option>`).join("")}</select>
    <label class="f" for="wTarget">Daily calorie target</label><input type="number" id="wTarget" inputmode="numeric" value="${profile.target}">
    <p class="tip">Not sure? 2,200 is a fair start for many adults. Ask the Coach later.</p>
    <button class="primary" style="margin-top:18px" data-act="savewelcome">Let's go</button>`;
  }
}
function openWelcome() { sheet = { kind: "welcome" }; renderSheet(); showSheet(); }

/* ============ meals ============ */
function commitMeal() {
  const s = sheet; const day = getDay(s.date);
  const time = $("#mtime")?.value || s.time;
  const items = s.items.filter(i => i.name.trim());
  if (!items.length) { s.err = "Give at least one item a name."; renderSheet(); return; }
  day.meals = day.meals.filter(m => m.gid !== s.gid);
  items.forEach(i => day.meals.push({ id: uid(), gid: s.gid, time, name: i.name.trim(), qty: i.qty, kcal: Math.round(+i.kcal || 0), p: i.p, c: i.c, f: i.f, tags: i.tags }));
  saveDay(day);
  const tot = Math.round(items.reduce((a, i) => a + (+i.kcal || 0), 0));
  closeSheet(); viewDate = s.date; go("today"); toast(s.mode === "edit" ? "Saved" : `Added ${fmt(tot)} kcal`);
}

async function logIt() {
  const text = ($("#addText")?.value ?? addText).trim(); addText = text;
  if (!text && !addPhoto) { addErr = "Type what you ate or add a photo first."; render(); return; }
  addBusy = true; addErr = ""; render();
  try {
    const r = await api("/api/log", { text, imageBase64: addPhoto?.b64, mimeType: "image/jpeg", goal: GOALS[profile.goal] });
    if (!r.items?.length) throw new Error("I couldn't spot any food. Try describing it in words.");
    const thumb = addPhoto?.url || null;
    addBusy = false; addText = ""; addPhoto = null; addErr = ""; render();
    openReview({ items: r.items.map(i => ({ ...i, p: i.protein_g, c: i.carbs_g, f: i.fat_g })), summary: r.summary, unsure: r.unsure, thumb });
  } catch (e) { addBusy = false; addErr = e.message; render(); }
}
async function addMissed() {
  const inp = $("#missed"); const text = inp.value.trim(); if (!text) return;
  sheet.busy = true; sheet.err = ""; renderSheet();
  try {
    const r = await api("/api/log", { text, goal: GOALS[profile.goal] });
    if (!r.items?.length) throw new Error("no items");
    r.items.forEach(i => sheet.items.push({ id: uid(), name: i.name, qty: i.qty, kcal: i.kcal, p: i.protein_g, c: i.carbs_g, f: i.fat_g, tags: i.tags }));
  } catch (e) {
    sheet.items.push({ id: uid(), name: text, qty: "", kcal: 0, p: 0, c: 0, f: 0, tags: [] });
    sheet.err = "Couldn't estimate it (" + e.message + ") — I added it as a row. Type the calories yourself.";
  }
  sheet.busy = false; renderSheet();
}

/* ============ photos ============ */
function loadPhoto(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onerror = () => toast("Couldn't read that photo");
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1024, sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/jpeg", 0.82);
      addPhoto = { url, b64: url.split(",")[1] }; addErr = "";
      if (tab !== "add") tab = "add"; renderTabs(); render();
    };
    img.onerror = () => toast("That image format isn't supported");
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* ============ GPS: walk vs train ============ */
const haversine = (a, b, c, d) => { const R = 6371000, r = x => x * Math.PI / 180; const dl = r(c - a), dn = r(d - b); const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
let wakeLock = null;
async function lockScreen() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch { } }
document.addEventListener("visibilitychange", () => { if (tracking && document.visibilityState === "visible") lockScreen(); });

function startTrack() {
  if (!navigator.geolocation) { trackInfo.err = "Location isn't available on this device."; render(); return; }
  trackInfo = { cls: "still", kmh: 0, km: 0, err: "" };
  tracking = { last: null, speeds: [], cand: null, candN: 0, seg: null, lastSave: 0 };
  tracking.id = navigator.geolocation.watchPosition(onFix, e => {
    stopTrack(); trackInfo.err = e.code === 1 ? "Location is blocked. Allow it in your browser settings." : "Couldn't get a GPS signal.";
    render();
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 25000 });
  lockScreen(); render(); toast("Tracking started");
}
function stopTrack() {
  if (!tracking) return;
  navigator.geolocation.clearWatch(tracking.id); finishSeg(); tracking = null;
  try { wakeLock?.release(); } catch { } wakeLock = null;
  render();
}
function onFix(p) {
  if (!tracking) return;
  const { latitude: la, longitude: lo, accuracy, speed } = p.coords, t = p.timestamp || Date.now();
  if (accuracy > 60) return;
  let kmh = speed != null && !isNaN(speed) ? speed * 3.6 : null, d = 0;
  if (tracking.last) {
    d = haversine(tracking.last.la, tracking.last.lo, la, lo); const dt = (t - tracking.last.t) / 1000;
    if (kmh == null && dt > 0) kmh = d / dt * 3.6;
  }
  tracking.last = { la, lo, t };
  if (kmh == null) return;
  tracking.speeds.push(kmh); if (tracking.speeds.length > 4) tracking.speeds.shift();
  const avg = tracking.speeds.reduce((a, b) => a + b, 0) / tracking.speeds.length;
  const cls = avg < 1 ? "still" : avg < 8 ? "walk" : "train";
  // need 3 fixes in a row of a new class before switching (avoids flicker)
  const curCls = tracking.seg ? tracking.seg.type : "still";
  if (cls !== curCls) { tracking.candN = tracking.cand === cls ? tracking.candN + 1 : 1; tracking.cand = cls; }
  else { tracking.cand = null; tracking.candN = 0; }
  if (tracking.cand && tracking.candN >= 3) {
    finishSeg();
    if (cls !== "still") tracking.seg = { id: uid(), type: cls, start: t, end: t, m: 0 };
    tracking.cand = null; tracking.candN = 0;
  }
  if (tracking.seg) { tracking.seg.m += d > 3 ? d : 0; tracking.seg.end = t; }
  trackInfo.cls = tracking.seg ? tracking.seg.type : "still"; trackInfo.kmh = avg;
  trackInfo.km = tracking.seg ? tracking.seg.m / 1000 : 0;
  if (tracking.seg && t - tracking.lastSave > 15000) { saveSeg(); tracking.lastSave = t; }
  if (tab === "today" && viewDate === todayISO() && !sheet) render();
}
function saveSeg(final) {
  const s = tracking?.seg; if (!s) return;
  const mins = (s.end - s.start) / 60000; const day = getDay(todayISO());
  const hrs = mins / 60, kmh = hrs > 0 ? s.m / 1000 / hrs : 0;
  const met = s.type === "train" ? TYPES.train.met : kmh < 3.2 ? 2.8 : kmh < 4.8 ? 3.5 : kmh < 6.4 ? 4.3 : 5.0;
  const hm = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const entry = { id: s.id, activity: s.type, start: hm(s.start), end: hm(Math.max(s.end, s.start + 60000)), min: Math.max(mins, 0.5), km: s.m / 1000, met, source: "gps" };
  const i = day.schedule.findIndex(a => a.id === s.id);
  if (i >= 0) day.schedule[i] = entry; else day.schedule.push(entry);
  saveDay(day);
}
function finishSeg() {
  const s = tracking?.seg; if (!s) return;
  if ((s.end - s.start) < 45000) {   // too short to matter: drop it
    const day = getDay(todayISO()); day.schedule = day.schedule.filter(a => a.id !== s.id); saveDay(day);
  } else saveSeg(true);
  tracking.seg = null;
}

/* ============ export / import ============ */
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportCsv() {
  const rows = [["date", "time", "item", "amount", "kcal", "protein_g", "carbs_g", "fat_g"]];
  allDays().forEach(k => { const d = k.slice(-10); getDay(d).meals.forEach(m => rows.push([d, m.time, m.name, m.qty, m.kcal, m.p, m.c, m.f])); });
  download("calorie-coach.csv", rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv");
}
function exportJson() {
  const out = { app: "calorie-coach", profile, days: {} };
  allDays().forEach(k => { try { out.days[k.slice(-10)] = JSON.parse(LS.get(k)); } catch { } });
  download("calorie-coach-backup.json", JSON.stringify(out), "application/json");
}
function restore(file) {
  if (!file) return;
  file.text().then(t => {
    const o = JSON.parse(t); if (o.app !== "calorie-coach") throw 0;
    Object.entries(o.days || {}).forEach(([d, v]) => LS.set(dayKey(d), JSON.stringify(v)));
    if (o.profile) { profile = { ...profile, ...o.profile }; saveProfile(); }
    toast("Backup restored"); render();
  }).catch(() => toast("That isn't a Calorie Coach backup"));
}

/* ============ events ============ */
const actions = {
  tab: el => go(el.dataset.t),
  prevday: () => { viewDate = addDays(viewDate, -1); render(); },
  nextday: () => { if (viewDate < todayISO()) { viewDate = addDays(viewDate, 1); render(); } },
  askNext: () => askCoach("What should I eat next?"),
  quickq: el => askCoach(el.dataset.q),
  ask: () => { const q = ($("#coachText")?.value || "").trim(); if (q) askCoach(q); },
  logsug: el => { const s = coachMsgs[+el.dataset.m].sug[+el.dataset.s]; openReview({ items: [{ name: s.name, qty: "1 serving", kcal: s.kcal }] }); },
  cam: () => $("#fileCam").click(), gal: () => $("#fileGal").click(),
  rmphoto: () => { addPhoto = null; render(); },
  logit: logIt,
  manual: () => openReview({ items: [{ name: "", qty: "", kcal: 0 }] }),
  quick: el => { const m = recentFoods()[+el.dataset.i]; openReview({ items: [{ name: m.name, qty: m.qty, kcal: m.kcal, p: m.p, c: m.c, f: m.f, tags: m.tags }] }); },
  editmeal: el => { const g = mealGroups(getDay(viewDate)).find(x => x.gid === el.dataset.g); if (g) openReview({ items: g.items, gid: g.gid, time: g.time, mode: "edit" }); },
  rmitem: el => { sheet.items.splice(+el.dataset.i, 1); renderSheet(); },
  blankitem: () => { sheet.items.push({ id: uid(), name: "", qty: "", kcal: 0, p: 0, c: 0, f: 0, tags: [] }); renderSheet(); },
  addmissed: addMissed, savemeal: commitMeal,
  delmeal: () => { const day = getDay(sheet.date); day.meals = day.meals.filter(m => m.gid !== sheet.gid); saveDay(day); closeSheet(); render(); toast("Meal deleted"); },
  closesheet: closeSheet,
  addact: () => { sheet = { kind: "activity", err: "" }; renderSheet(); showSheet(); },
  saveact: () => {
    const type = $("#aType").value, st = $("#aStart").value, en = $("#aEnd").value;
    if (!st || !en || minsOf(en) <= minsOf(st)) { sheet.err = "End time must be after start time."; renderSheet(); return; }
    const day = getDay(viewDate); day.schedule.push({ id: uid(), activity: type, start: st, end: en }); saveDay(day);
    closeSheet(); render(); toast("Activity added");
  },
  delact: el => { const day = getDay(viewDate); day.schedule = day.schedule.filter(a => a.id !== el.dataset.id); saveDay(day); render(); },
  starttrack: startTrack, stoptrack: () => { stopTrack(); toast("Tracking stopped"); },
  savewelcome: () => {
    profile.weight = Math.min(250, Math.max(25, +$("#wWeight").value || 70)); profile.goal = $("#wGoal").value;
    profile.target = Math.min(6000, Math.max(1000, +$("#wTarget").value || 2200)); profile.onboarded = true; saveProfile(); closeSheet(); render();
  },
  install: async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; render(); },
  share: async () => {
    const data = { title: "Calorie Coach", text: "My AI calorie coach — try it:", url: location.href.split("#")[0] };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(data.url); toast("Link copied"); } } catch { }
  },
  exportCsv, exportJson, restore: () => $("#fileRestore").click(),
  health: async el => {
    const out = $("#healthOut"); out.innerHTML = '<p class="sub" style="margin-top:10px"><span class="spin"></span> Testing…</p>';
    try {
      const r = await api("/api/health?test=1", null, 30000);
      out.innerHTML = r.ok ? `<div class="note">✅ Connected. AI model: ${esc(r.model)}</div>` : `<div class="err">${esc(r.error || "The AI did not answer.")}</div>`;
    } catch (e) { out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (el && actions[el.dataset.act]) actions[el.dataset.act](el, e);
});
$("#scrim").addEventListener("click", () => { if (sheet && sheet.kind !== "welcome") closeSheet(); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "addText") addText = t.value;
  else if (t.id === "coachText") coachText = t.value;
  else if (t.id === "mtime" && sheet) sheet.time = t.value;
  else if (t.id === "dayNote") { const d = getDay(todayISO()); d.notes = t.value; saveDay(d); }
  else if (t.dataset.f && sheet?.items) {
    const it = sheet.items[+t.dataset.i]; if (!it) return;
    if (t.dataset.f === "kcal") {
      const nk = Math.max(0, +t.value || 0);
      if (it.kcal > 0 && nk > 0) { const r = nk / it.kcal; it.p *= r; it.c *= r; it.f *= r; }
      it.kcal = nk; const tot = $("#sheetTotal"); if (tot) tot.textContent = fmt(sheetTotal());
    } else it[t.dataset.f] = t.value;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "pName") { profile.name = t.value.trim(); saveProfile(); }
  if (t.id === "pWeight") { profile.weight = Math.min(250, Math.max(25, +t.value || 70)); saveProfile(); }
  if (t.id === "pTarget") { profile.target = Math.min(6000, Math.max(1000, +t.value || 2200)); saveProfile(); }
  if (t.id === "pGoal") { profile.goal = t.value; saveProfile(); }
  if (t.id === "pWorker") { const v = t.value.trim(); LS.set("cc_worker_url", v); toast(v ? "Server saved" : "Using default server"); }
  if (t.id === "pTheme") { LS.set("cc_theme", t.value); applyTheme(); }
  if (t.id === "fileCam" || t.id === "fileGal") { loadPhoto(t.files[0]); t.value = ""; }
  if (t.id === "fileRestore") { restore(t.files[0]); t.value = ""; }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "coachText") { e.preventDefault(); actions.ask(); }
  if (e.target.id === "missed") { e.preventDefault(); addMissed(); }
});

/* ============ theme, install, service worker ============ */
function applyTheme() {
  const t = LS.get("cc_theme", "auto"); const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelector('meta[name=theme-color]').content = dark ? "#0F1E21" : "#F5F1E6";
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (tab === "you") render(); });
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.register("sw.js").catch(() => { });
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded && !tracking && !sheet) { reloaded = true; location.reload(); } });
}

applyTheme(); renderTabs(); render();
setInterval(() => { if (tab === "today" && viewDate === todayISO() && !sheet && !tracking && document.visibilityState === "visible") render(); }, 60000);
</script>
